name: Update fleet data and deploy

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fleet-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull latest data from Launch Library 2
        env:
          LL2_TOKEN: ${{ secrets.LL2_TOKEN }}   # optional
          LL2_MAX_WAIT: "1500"
        run: node scripts/build-data.mjs

      - name: Commit data
        run: |
          git config user.name "fleet-bot"
          git config user.email "fleet-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update fleet data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || echo "push skipped"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
