<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flight Proven</title>
  <meta name="description" content="SpaceX Falcon 9, Falcon Heavy, Starship and Dragon fleet tracker: every booster and ship, every flight, and what is in orbit right now.">
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4fd8'/%3E%3Crect x='13' y='5' width='6' height='20' fill='%23fff'/%3E%3Crect x='13' y='5' width='6' height='5' fill='%23111'/%3E%3Cpath d='M12 22 l-3 5 h4z M20 22 l3 5 h-4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { const t = localStorage.getItem('fp.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="Flight Proven home">
        <svg viewBox="0 0 24 40" aria-hidden="true"><rect x="8" y="2" width="8" height="30" rx="1" class="brand-hull"/><rect x="8" y="2" width="8" height="7" class="brand-dark"/><path d="M7 26 l-3 8 h4z M17 26 l3 8 h-4z" class="brand-dark"/></svg>
        <span class="brand-name">Flight Proven</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/" data-tab="fleet">Fleet</a>
        <a href="#/leaders" data-tab="leaders">Leaders</a>
        <a href="#/archive" data-tab="archive">Archive</a>
        <a href="#/orbit" data-tab="orbit">On orbit</a>
      </nav>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme" title="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 7a5 5 0 0 0 0 10z" class="fillhalf"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="app" class="wrap" tabindex="-1">
    <div class="loading"><div class="loading-bar"></div><p id="loadingMsg">Loading fleet data…</p></div>
  </main>

  <footer class="foot wrap">
    <p>Data: <a href="https://thespacedevs.com/llapi" target="_blank" rel="noopener">Launch Library 2 by The Space Devs</a>. Not affiliated with SpaceX. <span id="freshness"></span></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
